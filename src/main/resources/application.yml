spring:
  application:
    name: EZBar Backend API
  profiles:
    active: dev
  security:
    user:
      # Credenciales eliminadas por seguridad. Se usa autenticación por Base de Datos.
      name: ${SECURITY_USER_NAME:admin_disabled}
      password: ${SECURITY_USER_PASSWORD:password_disabled}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  cache:
    type: caffeine
  mvc:
    log-request-details: true

server:
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 30000

# Propiedades personalizadas
ezbar:
  request:
    timeout-ms: 30000
  security:
    https-required: false # Cambiar a true en producción para máxima seguridad
